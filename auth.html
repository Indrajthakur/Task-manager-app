
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager | Authentication</title>

    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/variables.css">
    <link rel="stylesheet" href="./css/auth.css">
</head>

<body>

    <div class="auth-container">

        <div class="auth-card">

            <h1>Welcome Back</h1>
            <p id="authDescription">Login to manage your tasks</p>

            <div class="auth-tabs">
                <button type="button" id="loginTab" class="active">
                    Login
                </button>

                <button type="button" id="signupTab">
                    Sign Up
                </button>
            </div>

            <form id="authForm">

                <div class="auth-field">
                    <label for="authEmail">Email</label>
                    <input
                        type="email"
                        id="authEmail"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="auth-field">
                    <label for="authPassword">Password</label>
                    <input
                        type="password"
                        id="authPassword"
                        placeholder="Enter your password"
                        minlength="8"
                        required
                    >
                </div>

                <div class="auth-field" id="confirmPasswordField" hidden>
                    <label for="confirmPassword">Confirm Password</label>
                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your password"
                    >
                </div>

                <button type="submit" id="authSubmit">
                    Login
                </button>

                <p id="authMessage"></p>

            </form>

        </div>

    </div>

    <script type="module" src="./js/auth.js"></script>

</body>
</html>
